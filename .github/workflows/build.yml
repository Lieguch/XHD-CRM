name: build-and-test

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: dotnet --version
        run: dotnet --version
      - name: dotnet restore
        run: dotnet restore XHDCRM3.sln
      - name: dotnet build
        run: dotnet build XHDCRM3.sln --no-restore --configuration Release --verbosity normal
      - name: dotnet test
        run: dotnet test 7.Test/XHD.Core.Tests/XHD.Core.Tests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: **/*.trx
